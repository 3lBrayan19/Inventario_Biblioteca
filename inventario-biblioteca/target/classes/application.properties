# ============================================
# Sistema de Inventario de Biblioteca
# ============================================
spring.application.name=inventario-biblioteca

# === MySQL ===
# IMPORTANTE: si tu contrasena de MySQL no es "root123", cambiala aqui abajo
spring.datasource.url=jdbc:mysql://localhost:3306/inventario_biblioteca_db?useSSL=false&serverTimezone=America/Lima&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# === JPA / Hibernate ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# true evita el error 500 al serializar relaciones (LazyInitializationException)
spring.jpa.open-in-view=true

server.port=8080
